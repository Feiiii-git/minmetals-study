<script>
const DATA={"lessons":[{"id":"c1","track":"culture","day":1,"title":"五矿是谁：使命、愿景与战略定位","sub":"记住集团定位与企业文化的核心措辞","duration":40,"sections":[{"title":"① 先辨认公司与集团","lead":"中国五矿集团是以金属矿产为主业的中央企业集团；五矿资本是其金融业务相关上市平台。考试最容易混淆集团整体与金融子公司的业务。","points":["中国五矿：金属矿产主业，关注资源保障、科技创新和产业链服务。","五矿资本：金融控股平台，旗下核心业务包括信托、金融租赁、证券和期货。","同一道题出现“集团”还是“资本”，先划出主体再选择。"],"example":"题干说“矿业报国”的主体是中国五矿集团；题干问“五矿期货”则属于金融平台业务。","trap":"不要把“五矿资本”误当成只做矿山开采的企业。","formula":""},{"title":"② 初心使命","lead":"中国五矿集团官网的现行核心文化表述为“矿业报国、矿业强国”。这是第一优先级的记忆题。","points":["原文：矿业报国、矿业强国。","“报国”对应服务国家战略；“强国”对应提升关键金属资源保障和产业能力。","记忆时保持用词顺序，不自行替换为“金融报国”等类似表达。"],"example":"选择题常把“矿业报国”改成“实业报国”“金融报国”作为干扰项。","trap":"","formula":""},{"title":"③ 战略愿景","lead":"战略愿景的关键是“全球竞争力 + 世界一流 + 金属矿产企业集团”。","points":["完整表述：成为具有全球竞争力的世界一流金属矿产企业集团。","核心修饰语是“金属矿产”，不是“综合金融”“能源电力”。","“世界一流”同时体现目标定位。"],"example":"填空题常挖去“金属矿产企业集团”让你从多个行业中选。","trap":"","formula":""},{"title":"④ 品牌定位与三个作用","lead":"官网品牌定位与央企责任是经常与使命一起出现的考点。","points":["品牌定位：资源保障国家队、两新服务主力军。","中央企业“三个作用”：科技创新、产业控制、安全支撑。","从企业使命理解：金属资源安全、关键技术攻关、产业链协同。"],"example":"记忆链：矿业报国 → 资源保障 → 创新、控制、安全。","trap":"“三个作用”是央企角色表述，不是四家金融公司的业务分类。","formula":""}],"questions":[{"q":"中国五矿集团的现行初心使命是？","o":["金融报国、金融强国","矿业报国、矿业强国","资源兴国、资本强国","实业至上、利润优先"],"a":1,"why":"集团官方表述为“矿业报国、矿业强国”。"},{"q":"中国五矿的战略愿景最准确的是？","o":["世界一流商业银行集团","全球第一证券控股公司","具有全球竞争力的世界一流金属矿产企业集团","全国最大的单一矿山企业"],"a":2,"why":"注意“全球竞争力、世界一流、金属矿产企业集团”三个部分。"},{"q":"以下哪项最符合五矿集团的行业主业定位？","o":["金属矿产","互联网社交","医药零售","航空客运"],"a":0,"why":"五矿是以金属矿产为主业的央企集团。"},{"q":"五矿集团品牌定位包括？","o":["零售银行国家队","综合保险领军者","国际航运服务商","资源保障国家队、两新服务主力军"],"a":3,"why":"来自集团官方品牌理念。"},{"q":"央企需要发挥的“三个作用”包括？","o":["零售、营销、广告","科技创新、产业控制、安全支撑","存款、贷款、理财","股票、债券、期货"],"a":1,"why":"国有企业“三个作用”指科技创新、产业控制、安全支撑。"},{"q":"五矿资本与中国五矿集团最恰当的关系是？","o":["完全无关","五矿资本是集团的金融业务相关平台","五矿集团只开展期货经纪","五矿资本是中央银行"],"a":1,"why":"企业整体与金融板块业务范围不同。"},{"q":"“矿业报国”主要强调的是？","o":["金融服务实体经济完全不重要","只重视股价波动","以矿业发展服务国家战略","完全放弃产业链建设"],"a":2,"why":"文化内涵围绕资源保障和国家战略。"},{"q":"下列不属于集团愿景中的关键词的是？","o":["世界一流","全球竞争力","金属矿产","大型商业银行"],"a":3,"why":"愿景定位“金属矿产企业集团”。"},{"q":"题目问“中国五矿”战略时，下列最适合先识别的主体是？","o":["集团整体","五矿期货单一营业部","一家海外交易所","任意公募基金"],"a":0,"why":"审题先区分集团与金融业务公司。"},{"q":"下列哪一项与资源保障战略关系最直接？","o":["提高游戏用户数量","增强关键金属矿产资源供应能力","降低电视剧制作成本","扩大餐饮网点"],"a":1,"why":"关键金属矿产资源保障符合五矿主业及使命。"},{"q":"以下哪项属于央企在国家战略中的重要作用？","o":["纯粹追求短期投机收益","完全退出战略性产业","产业控制与安全支撑","由个人决定货币政策"],"a":2,"why":"发挥产业控制与安全支撑作用。"},{"q":"与“集团愿景”相匹配的目标是？","o":["全面转型为互联网游戏平台","仅运营一只证券基金","成为纯粹的贸易代理商","建设具有全球竞争力的世界一流金属矿产企业集团"],"a":3,"why":"题干几乎直接复述愿景。"}],"keywords":["矿业报国 矿业强国","世界一流金属矿产","资源保障国家队","科技创新 产业控制 安全支撑"],"source":["https://www.minmetals.com.cn/gywk_7233/qywh/","https://www.minmetals.com.cn/gywk_7233/ppln/"],"priority":"核心"},{"id":"c2","track":"culture","day":2,"title":"五矿怎么做：品牌理念与企业精神","sub":"容易混淆的企业文化细节，一次归纳","duration":40,"sections":[{"title":"① 五个文化关键词","lead":"官网品牌理念概括了集团的价值导向，选择题最常考“哪一项不属于”。","points":["世界一流——使命担当。","自主创新——引领作用；问题导向——工作思维。","精益求精——品质坚守；敢于胜利——奋斗精神。"],"example":"顺口记：一流、创新、问题、精益、胜利。","trap":"不要用“短期利润最大化”“规模至上”替代。","formula":""},{"title":"② 员工行为准则九种文化","lead":"九类文化可通过“词语配对”学习，不需要一开始逐字强记全文。","points":["创新文化：创新驱动、引领未来；经营文化：创造价值、合作共赢。","法治文化：依法治企、合规经营；安全文化：生命至上、安全第一。","绿色文化：绿色发展、和谐共生；质量文化：匠心品质、精益求精。","人才文化：德才兼备、人尽其才；风控文化：居安思危、未雨绸缪；廉洁文化：崇廉尚洁、恪守底线。"],"example":"看到“未雨绸缪”优先联想到风控文化，“合规经营”对应法治文化。","trap":"","formula":""},{"title":"③ 历史表述与现行口径","lead":"有些旧备考资料会出现“珍惜有限，创造无限”，它是长期使用的传统品牌文化表达，但本轮背诵应以集团官网当前页面为主。","points":["当前优先记：初心使命、战略愿景、品牌定位、五个文化关键词。","旧资料里出现历史表述，需辨别题目年份或明确问法。","当出现两个正确但不同年代的口径时，优先核验官方发布日期。"],"example":"本轮题目对现行官方口径与传统表述分开考，不混用。","trap":"公司文化、品牌口号可能随时间调整；临考可再查官网更新。","formula":""},{"title":"④ 央企价值导向与合规","lead":"文化题有时以情境题出现，用“国企长期价值、合规、安全、质量、创新”判断。","points":["内部控制要求职责分离、授权审批和风险识别。","安全与合规优先于追逐不可控高收益。","战略与文化通过可持续经营和服务实体经济体现。"],"example":"某部门建议绕过风控加快交易，最符合文化的处理应当是履行合规流程。","trap":"","formula":""}],"questions":[{"q":"哪一项是五矿品牌价值导向关键词？","o":["风险外包","自主创新","成本唯一","短期投机"],"a":1,"why":"五个关键词包括自主创新。"},{"q":"“问题导向”对应的是什么？","o":["生产指标","股权比例","工作思维","贷款利率"],"a":2,"why":"官网表述为“问题导向的工作思维”。"},{"q":"“精益求精”主要对应？","o":["营销话术","税收制度","贸易关税","品质坚守"],"a":3,"why":"精益求精强调品质坚守。"},{"q":"“敢于胜利”主要体现？","o":["奋斗精神","保险赔付","投融资期限","利润分配"],"a":0,"why":"五矿集团文化表述为“敢于胜利的奋斗精神”。"},{"q":"五个文化关键词中不包括？","o":["世界一流","短期利润至上","自主创新","问题导向"],"a":1,"why":"不存在“短期利润至上”这一文化关键词。"},{"q":"“依法治企，合规经营”对应哪类员工行为准则？","o":["质量文化","绿色文化","法治文化","人才文化"],"a":2,"why":"法治文化对应依法治企、合规经营。"},{"q":"“居安思危，未雨绸缪”对应？","o":["廉洁文化","创新文化","经营文化","风控文化"],"a":3,"why":"风控文化强调提前发现并防范风险。"},{"q":"“生命至上，安全第一”对应？","o":["安全文化","经营文化","风控文化","人才文化"],"a":0,"why":"安全文化对应“生命至上、安全第一”。"},{"q":"“崇廉尚洁，恪守底线”对应？","o":["人才文化","廉洁文化","绿色文化","创新文化"],"a":1,"why":"廉洁文化的关键词。"},{"q":"“德才兼备，人尽其才”对应？","o":["法治文化","质量文化","人才文化","经营文化"],"a":2,"why":"人才文化强调用人理念。"},{"q":"遇到旧资料里“珍惜有限，创造无限”，更合理的备考方法是？","o":["直接否认历史上存在","把它当成2026唯一使命","不再学习任何企业文化","区分传统表述与当前官网口径"],"a":3,"why":"传统表述可以了解，现行标准表述以官网最新页面为准。"},{"q":"符合央企合规与风控文化的做法是？","o":["在审批授权范围内开展业务并识别风险","为效率取消复核","隐瞒潜在风险","优先短期套利不考虑合规"],"a":0,"why":"文化情境题以合规、安全和长期责任判断。"}],"keywords":["世界一流","自主创新","问题导向","精益求精","敢于胜利","法治文化","风控文化","廉洁文化"],"source":["https://www.minmetals.com.cn/gywk_7233/ppln/"],"priority":"核心"},{"id":"c3","track":"culture","day":3,"title":"五矿资本：核心业务与金融政策","sub":"把企业文化和报考岗位连接起来","duration":50,"sections":[{"title":"① 五矿资本的业务版图","lead":"根据五矿资本2025年年报，上市公司通过五矿资本控股控制的主要金融牌照公司包括四家。","points":["五矿信托 → 信托业务及固有业务。","外贸金租 → 金融租赁，包括直租、售后回租等。","五矿证券 → 经纪、投行、资管、自营等获准业务。","五矿期货 → 期货经纪、交易咨询、资管及相关风险管理服务。"],"example":"问“基差贸易、仓单服务”更容易关联五矿期货相关风险管理业务。","trap":"集团金融生态不止四种金融相关活动；本讲“四家”限定为年报列举的主要控股牌照公司。","formula":""},{"title":"② 产业金融怎么服务矿业","lead":"金融业务的业务价值常常来自对产业真实需求的支持。","points":["矿山企业担心未来矿产品跌价：卖出相关期货进行套保。","金属加工企业担心原料涨价：买入相关期货进行套保。","装备企业需要大型设备：融资租赁有助于匹配设备取得与分期现金流。"],"example":"矿企预计三个月后卖出铜，担心跌价 → 考虑空头套保。","trap":"套保不能消除所有风险；仍存在基差、保证金和交易对手等风险。","formula":""},{"title":"③ 金融五篇大文章","lead":"2025年国务院办公厅指导意见明确：科技金融、绿色金融、普惠金融、养老金融、数字金融。","points":["科技金融：服务科研创新及科技企业。","绿色金融：支持绿色低碳转型。","普惠金融：改善小微企业等主体融资服务。","养老金融：服务养老保障和养老产业。","数字金融：科技驱动金融服务与治理。"],"example":"“矿业绿色改造融资”可以对应绿色金融；“新材料企业研发融资”可以对应科技金融。","trap":"","formula":""},{"title":"④ 金融合规与机构职能","lead":"金融常识重点不是背所有法律条款，而是会识别基本机构职能与监管原则。","points":["中央银行主要执行货币政策，不是普通企业的证券承销商。","证券公司开展获准的证券经纪、投行、资管等业务。","资产管理信托不能承诺保本保收益。","金融服务实体经济，坚持审慎经营与风险防范。"],"example":"承诺“任何情况下固定高收益且无风险”的金融销售话术，应当引起风险和合规警惕。","trap":"","formula":""}],"questions":[{"q":"五矿资本主要金融牌照公司中，经营信托业务的是？","o":["五矿证券","外贸金租","五矿信托","五矿期货"],"a":2,"why":"五矿信托经营信托业务。"},{"q":"外贸金租对应的业务是？","o":["融资租赁","商业银行结算","保险承保","货币发行"],"a":0,"why":"外贸金租为金融租赁公司。"},{"q":"五矿证券属于哪类机构？","o":["商业银行","证券公司","中央银行","保险机构"],"a":1,"why":"五矿证券主要开展证券经纪、投行、资管等业务。"},{"q":"期货基差贸易、仓单服务最直接关联？","o":["五矿信托","外贸金租","国务院财政部","五矿期货相关风险管理业务"],"a":3,"why":"年报披露五矿期货相关风险管理业务涵盖基差贸易和仓单服务。"},{"q":"企业担心未来销售的金属价格下跌，通常考虑？","o":["买入期货套保","买入股票","卖出期货套保","取消所有销售"],"a":2,"why":"未来有现货卖出需求的主体可考虑卖出期货对冲跌价风险。"},{"q":"企业担心未来采购铜的价格上涨，通常考虑？","o":["买入铜期货套保","卖出铜期货套保","不必管理风险","卖出设备"],"a":0,"why":"未来买入现货，担心涨价时，期货多头常用于套保。"},{"q":"以下哪项不属于金融“五篇大文章”？","o":["科技金融","投机金融","养老金融","绿色金融"],"a":1,"why":"正式五篇是科技、绿色、普惠、养老、数字金融。"},{"q":"服务中小微经营主体的金融服务常与哪一项更相关？","o":["外汇储备","期权隐含波动率","银行间拆借","普惠金融"],"a":3,"why":"普惠金融强调服务小微等主体的金融可得性。"},{"q":"为技术创新企业提供股债等融资服务，更接近？","o":["绿色金融仅限制造","养老金融","科技金融","传统财政征税"],"a":2,"why":"科技金融服务科技创新活动及企业。"},{"q":"信托业务现行“三分类”不包括？","o":["资产服务信托","资产管理信托","公益慈善信托","活期存款信托"],"a":3,"why":"三分类为资产服务、资产管理、公益慈善信托。"},{"q":"关于资产管理信托，哪项说法正确？","o":["通常不得承诺保本保收益","与银行存款完全等同","不存在市场风险","法律允许无限保证收益"],"a":0,"why":"资管产品原则上需打破刚性兑付。"},{"q":"关于五矿资本，哪项描述与2025年年报相符？","o":["只开展保险承保业务","核心控股业务覆盖信托、金融租赁、证券、期货","属于人民银行分支机构","只开展商业银行业务"],"a":1,"why":"年报列出四家主要金融牌照公司及相应业务。"}],"keywords":["五矿信托→信托","外贸金租→租赁","五矿证券→证券","五矿期货→期货","科技 绿色 普惠 养老 数字"],"source":["https://paper.cnstock.com/html/2026-04/18/content_2201598.htm","https://app.www.gov.cn/govdata/gov/202503/05/525163/article.html"],"priority":"核心"},{"id":"f1","track":"finance","day":1,"title":"经济学与宏观政策","sub":"30分钟建立宏微观考试框架","duration":55,"sections":[{"title":"① 供需与弹性","lead":"经济学先把“供给、需求、价格”三者联系起来。其他因素不变时，价格上涨通常使需求量减少；供给增加通常令均衡价格下降。","points":["价格变动→沿同一需求曲线移动；偏好、收入等改变→需求曲线移动。","供给增加：均衡价格通常下降、均衡数量增加。","需求价格弹性绝对值＝需求量变动百分比÷价格变动百分比。"],"example":"某商品涨价10%，销量减少20%，需求价格弹性绝对值≈2，说明需求较富有弹性。","trap":"供给增加与需求增加对均衡价格的影响方向可能不同，先找曲线。","formula":""},{"title":"② GDP、CPI与通胀","lead":"GDP反映一定时期内生产的最终产品与服务总价值。CPI是消费者价格指数，常用于观察居民消费价格变化。","points":["支出法GDP＝消费C＋投资I＋政府购买G＋净出口(X−M)。","通胀是一般价格水平持续上涨，不能用单件商品涨价判断。","名义GDP按当期价格，实际GDP剔除价格变化影响。"],"example":"C=200、I=40、G=60、X=20、M=10，则GDP=310。","trap":"","formula":""},{"title":"③ 财政政策与货币政策","lead":"中央银行偏重调节货币和信用条件，政府财政政策偏重税收与支出。","points":["扩张性货币政策典型为降息、降准、公开市场净投放。","扩张性财政政策典型为增加政府支出、减税。","实际政策效果受市场预期、融资需求等制约。"],"example":"题干“中央银行买入证券”一般属于公开市场货币投放；“政府增加基建支出”属于财政扩张。","trap":"","formula":""},{"title":"④ 汇率与经济周期","lead":"汇率指不同货币之间的兑换比率，其报价方向必须先搞清楚。","points":["若以1美元兑换人民币数量计价，数值上升说明人民币相对美元贬值。","本币贬值一般降低本币计价出口品的外币价格，其他条件不变。","经济周期常分为扩张、顶峰、衰退、谷底，非严格机械规律。"],"example":"USD/CNY由7.0变7.2，按该报价表示美元更贵、人民币对美元贬值。","trap":"","formula":""}],"questions":[{"q":"其他条件不变，供给增加通常导致？","o":["均衡价格下降、均衡数量增加","价格与数量都下降","价格与数量都上升","价格上升、数量下降"],"a":0,"why":"供给曲线向右移动，通常价降量升。"},{"q":"商品价格上涨20%，需求量下降30%，初始值百分比弹性绝对值为？","o":["0.6","1","1.5","2"],"a":2,"why":"30%÷20%=1.5。"},{"q":"收入提高使正常商品需求增加，通常表现为？","o":["沿原需求曲线向左移","需求曲线右移","供给曲线左移","需求不变"],"a":1,"why":"其他因素导致整个需求变化。"},{"q":"C=100、I=30、G=40、X=20、M=10，支出法GDP是？","o":["160","170","200","180"],"a":3,"why":"100+30+40+20−10=180。"},{"q":"CPI主要衡量？","o":["居民消费价格水平变化","企业债务总额","货币发行数量","股票估值"],"a":0,"why":"CPI为消费者价格指数。"},{"q":"以下属于扩张性财政政策的是？","o":["央行提高准备金率","政府增加公共支出","央行卖出债券","银行上调贷款利率"],"a":1,"why":"财政政策是政府税收及支出工具。"},{"q":"以下属于典型扩张性货币政策的是？","o":["提高准备金率","增税","降低政策利率","政府减少支出"],"a":2,"why":"降息通常支持信贷、投资和消费。"},{"q":"中央银行公开市场买入证券通常会？","o":["减少银行体系准备金","提高所得税","立即将GDP翻倍","向金融体系投放流动性"],"a":3,"why":"央行买入证券支付资金，增加准备金。"},{"q":"USD/CNY从7.0升至7.2，通常表示？","o":["人民币对美元贬值","人民币对美元升值","美元对人民币贬值","两币汇率不变"],"a":0,"why":"一美元需要更多人民币，人民币相对美元贬值。"},{"q":"以下哪种情况能够单独直接证明总体通货膨胀？","o":["一种进口水果涨价","一般物价水平持续上涨","某只股票上涨","单一地区房价上涨"],"a":1,"why":"通胀判断依据是一般物价水平。"},{"q":"实际GDP较名义GDP的主要区别是？","o":["一定更高","一定更低","剔除价格变动的影响","只计算出口"],"a":2,"why":"实际GDP以基期等价格核算实际产出。"},{"q":"经济过热和通胀压力加大时，央行可能采取？","o":["无限降准","无限降息","直接发放公司股息","紧缩性货币政策"],"a":3,"why":"紧缩政策通常通过提高资金成本或收紧流动性抑制过热。"}],"keywords":["供给增加→价降量升","GDP=C+I+G+X-M","扩张财政≠扩张货币","CPI","USD/CNY报价"],"source":[],"priority":"核心"},{"id":"f2","track":"finance","day":2,"title":"货币银行与利率基础","sub":"先掌握资金如何流动，再看金融机构","duration":55,"sections":[{"title":"① 股权、债权、直接与间接融资","lead":"资金需求者可以发行股权和债务工具，也可以通过金融中介融资。","points":["股票代表股东权益，不保证固定回报。","债券代表债权，发行人承担约定偿债义务。","直接融资：发行股票、债券；间接融资：商业银行贷款。"],"example":"企业通过券商承销发行公司债，通常仍是直接融资，因为最终融资关系直接对接投资者。","trap":"","formula":""},{"title":"② 利率、通胀和债券价格","lead":"货币时间价值指未来的钱通常需要折现；固定利率债券的市场价格与到期收益率通常反向变化。","points":["其他条件相同：市场收益率上升→存量固定利率债券价格下降。","实际利率近似＝名义利率−通货膨胀率。","准确费雪关系：(1+名义利率)≈(1+实际利率)(1+通胀率)。"],"example":"票息固定5元，当市场新债收益率提高时，旧债券价格一般下跌。","trap":"","formula":""},{"title":"③ 商业银行与中央银行","lead":"商业银行吸收存款、发放贷款；中央银行负责执行货币政策、维持金融体系平稳等。","points":["对银行：客户存款是银行负债；银行发放的贷款是银行资产。","法定准备金率提高，一般压缩银行潜在信用扩张空间。","央行公开市场买入证券一般增加金融体系流动性。"],"example":"银行发放100万元贷款给企业，对银行来说贷款是资产，资金来源相关存款等是负债。","trap":"","formula":""},{"title":"④ 金融市场基础","lead":"根据资金期限可以分为货币市场和资本市场；根据发行/流通阶段分为一级市场和二级市场。","points":["货币市场：短期资金工具，如短期国债、同业拆借。","资本市场：中长期融资，如股票、长期债券。","一级市场发行证券筹资，二级市场供已有证券交易。"],"example":"企业首次发行债券是一级市场行为，投资者之后买卖是二级市场行为。","trap":"","formula":""}],"questions":[{"q":"普通股票主要代表？","o":["债权","银行存款","股东权益","固定利率存款"],"a":2,"why":"股票属于权益工具。"},{"q":"公司通过证券公司承销发行债券，这通常属于？","o":["间接融资","存款保险","财政拨款","直接融资"],"a":3,"why":"即使有承销中介，企业直接对投资者形成债务关系。"},{"q":"企业申请银行贷款通常属于？","o":["间接融资","直接股权融资","政府税收","证券一级发行"],"a":0,"why":"银行信贷是典型间接融资。"},{"q":"市场收益率上升，已发行固定利率债券的价格通常？","o":["上涨","下跌","不变","必然归零"],"a":1,"why":"现金流固定、折现率提高，现值下降。"},{"q":"名义利率7%，通胀率3%，近似实际利率为？","o":["10%","21%","4%","7%"],"a":2,"why":"7%−3%=4%。"},{"q":"对商业银行而言，企业在该行的活期存款通常是？","o":["银行资产","股东权益","银行收入","银行负债"],"a":3,"why":"银行对存款人有还本付息/支付义务。"},{"q":"对商业银行而言，向客户发放的贷款通常是？","o":["银行资产","银行负债","股东分红","现金流量表"],"a":0,"why":"贷款是银行有权收回的债权。"},{"q":"中央银行下调法定存款准备金率，通常？","o":["缩小潜在信贷空间","提高银行潜在信贷投放能力","提高关税","必然降低企业利润"],"a":1,"why":"降准通常释放可用流动性。"},{"q":"短期同业拆借一般属于？","o":["外汇储备","商品市场","货币市场","一级股票市场"],"a":2,"why":"货币市场以短期融资工具为主。"},{"q":"股票发行后的投资者之间交易通常在？","o":["一级市场","外汇管制市场","商品期货交割市场","二级市场"],"a":3,"why":"二级市场交易已发行证券。"},{"q":"国家税收政策主要属于？","o":["财政政策","货币政策","会计准则","期货交易规则"],"a":0,"why":"税收属于财政工具。"},{"q":"其他条件相同，债券未来固定现金流折现率提高，其现值将？","o":["提高","下降","不变","翻倍"],"a":1,"why":"折现率越高，未来现金流现值越低。"}],"keywords":["股权vs债权","直接vs间接","银行资产与负债","利率↑债券价格↓","一级/二级市场"],"source":[],"priority":"核心"},{"id":"f3","track":"finance","day":3,"title":"股票债券、期货与风险","sub":"五矿相关金融工具重点学会“识别场景”","duration":60,"sections":[{"title":"① 股票债券的基础估值","lead":"选择题优先记简单估值指标及其限制。","points":["PE（市盈率）＝股价÷每股收益；PB（市净率）＝股价÷每股净资产。","债券收益率变动影响债券现值；修正久期大，价格对小幅收益率变化更敏感。","分散投资主要减少个别公司特有的非系统性风险。"],"example":"股价40、每股收益4，PE=10倍。","trap":"市盈率为负或盈利异常时直接比较PE可能失真。","formula":""},{"title":"② 期货与期权","lead":"两者都是衍生品，但权利义务结构不同。","points":["期货：交易双方按规则承担履约义务，常实行保证金制度。","看涨期权买方：取得按执行价买入标的的权利，通常无必须行权义务。","期权买方支付权利金；卖方面临相应履约义务。"],"example":"把“买涨”对应看涨期权买方；但购买看涨期权与做多期货的风险结构不同。","trap":"","formula":""},{"title":"③ 套期保值方向","lead":"套保通过衍生品方向与现货风险方向相反来降低不利价格波动。","points":["未来要买原材料，怕涨价→买入期货。","未来要卖自产商品，怕跌价→卖出期货。","基差常定义为现货价格−期货价格，基差变化会影响套保结果。"],"example":"冶炼厂未来采购铜原料，最常见示例是买入铜期货对冲价格上涨。","trap":"","formula":""},{"title":"④ 风险分类与识别","lead":"笔试常给业务情境让你判断风险种类。","points":["信用风险：借款人或交易对手不履约。","市场风险：价格、利率、汇率等市场变量不利变化。","流动性风险：资金不能及时筹集，或资产难以合理价格卖出。","操作风险：人员、系统或流程缺陷导致损失。"],"example":"金融系统宕机导致交易错误→操作风险；交易对手违约→信用风险。","trap":"","formula":""}],"questions":[{"q":"股价30元，每股收益3元，PE为？","o":["3倍","30倍","10倍","90倍"],"a":2,"why":"30÷3=10倍。"},{"q":"股价24元，每股净资产6元，PB为？","o":["0.25倍","6倍","24倍","4倍"],"a":3,"why":"PB=24÷6=4倍。"},{"q":"其他条件相同，修正久期越大，意味着？","o":["债券对小幅收益率变动越敏感","违约概率必然越低","利息必然越高","债券必然不跌"],"a":0,"why":"久期用于衡量利率敏感度。"},{"q":"分散投资主要能减少？","o":["系统性市场风险","非系统性风险","所有宏观风险","所有通胀风险"],"a":1,"why":"公司特有风险可通过投资组合降低。"},{"q":"看涨期权买方获得什么？","o":["强制卖出义务","固定股息","按执行价买入标的的权利","银行存款权"],"a":2,"why":"看涨期权买方拥有买入权。"},{"q":"期权买方通常为取得权利支付？","o":["资本公积","违约罚款","保险赔偿","权利金"],"a":3,"why":"期权费也称权利金。"},{"q":"未来采购铜，担心铜价上涨，可考虑？","o":["买入铜期货套保","卖出铜期货套保","完全不交易","降低资产负债率"],"a":0,"why":"买入套保用于未来买入现货面临的涨价风险。"},{"q":"矿山未来售铜，担心价格下跌，可考虑？","o":["买入铜期货套保","卖出铜期货套保","只买看涨期权且必然盈利","增发股票即可消除价格风险"],"a":1,"why":"卖出套保用于未来卖出现货的跌价风险。"},{"q":"基差最常见的定义是？","o":["卖价-买价","债券价格-股票价格","现货价格-期货价格","利润-成本"],"a":2,"why":"基差＝现货价格−期货价格，注意题目约定。"},{"q":"交易对手未能履约主要属于？","o":["市场风险","操作风险","货币政策风险","信用风险"],"a":3,"why":"信用风险来源于违约或信用质量恶化。"},{"q":"交易系统故障引发错误主要属于？","o":["操作风险","信用风险","期限结构风险","股权稀释"],"a":0,"why":"系统、人员、流程问题属于操作风险。"},{"q":"债券无法及时按合理价格出售主要体现？","o":["汇率风险","市场流动性风险","违约必然发生","固定资产折旧"],"a":1,"why":"难以迅速成交或交易冲击过高属于市场流动性风险。"}],"keywords":["PE/PB","久期","看涨期权","买入/卖出套保","基差","四类风险"],"source":[],"priority":"核心"},{"id":"f4","track":"finance","day":4,"title":"会计学与三大财务报表","sub":"从零看懂公司“赚多少、欠多少、现金多少”","duration":60,"sections":[{"title":"① 六大会计要素和恒等式","lead":"会计考试核心是资产、负债、所有者权益、收入、费用、利润六类要素。","points":["资产＝负债＋所有者权益，是资产负债表平衡基础。","资产如现金、存货、应收账款；负债如借款、应付账款。","收入−费用等（依准则考虑利得损失）形成利润。"],"example":"资产500万、负债320万，所有者权益=180万。","trap":"","formula":""},{"title":"② 权责发生制和赊销","lead":"权责发生制强调按经济业务所属期间确认收入费用，不单看收付款时间。","points":["符合确认条件时，赊销可能立即确认收入和应收账款。","回款发生时，减少应收账款、增加现金，不再次确认相同收入。","计提折旧是费用确认过程，计提本身并无当期现金流出。"],"example":"出售一批产品，客户一个月后付款：本月可确认收入并增加应收账款（满足确认条件时）。","trap":"","formula":""},{"title":"③ 三大报表的不同功能","lead":"资产负债表是时点快照；利润表与现金流量表是期间报告。","points":["资产负债表：资产、负债、所有者权益。","利润表：收入、费用、利润。","现金流量表：经营、投资、筹资活动现金流。"],"example":"购置生产设备的现金支出，非金融企业通常分类为投资活动现金流出。","trap":"","formula":""},{"title":"④ 简单借贷记账","lead":"“借”和“贷”是记账方向，不等于生活中的借钱和还钱。","points":["资产增加通常记借方，资产减少记贷方。","负债、所有者权益增加通常记贷方，减少记借方。","费用增加通常记借方，收入增加通常记贷方。"],"example":"银行借款收到100万元：借记银行存款100万元；贷记短期借款100万元。","trap":"借贷必相等；切勿认为“借方永远等于负债”。","formula":""}],"questions":[{"q":"资产800、负债300，所有者权益多少？","o":["1100","800","300","500"],"a":3,"why":"800−300=500。"},{"q":"应收账款属于？","o":["资产","负债","所有者权益","费用"],"a":0,"why":"它是未来收款权利。"},{"q":"应付账款属于？","o":["收入","负债","利润","股权投资"],"a":1,"why":"企业有对外付款义务。"},{"q":"资产负债表主要反映？","o":["某期间现金流","某期间营业收入","某一时点财务状况","未来销售预算"],"a":2,"why":"资产负债表是时点数据。"},{"q":"利润表主要反映？","o":["公司某天银行存款余额","当日所有股东人数","贷款合同清单","一段期间经营成果"],"a":3,"why":"利润表是期间报告。"},{"q":"赊销商品且满足收入确认条件，未收到货款，通常首先增加？","o":["应收账款","银行存款","应付账款","短期借款"],"a":0,"why":"赊销形成应收账款。"},{"q":"计提固定资产折旧通常？","o":["使现金立即流出","形成非现金费用","使应收账款必然增加","使负债必然归零"],"a":1,"why":"折旧是非现金费用。"},{"q":"非金融制造企业支付现金购买设备，通常属于？","o":["筹资现金流入","经营现金流入","投资现金流出","筹资现金流出"],"a":2,"why":"购建长期资产通常属于投资活动现金流出。"},{"q":"一般制造企业收到银行借款，通常属于？","o":["投资活动流出","经营活动流出","投资活动流入","筹资活动流入"],"a":3,"why":"借款属于筹资活动。"},{"q":"权责发生制的主要依据是？","o":["业务发生及归属期间","现金一定要到账","客户的心情","股票交易价格"],"a":0,"why":"确认不只以现金到账为准。"},{"q":"下列哪类科目增加通常记借方？","o":["收入","资产","负债","所有者权益"],"a":1,"why":"资产、费用增加通常记借方。"},{"q":"企业从银行借入资金并存入银行，最典型的变化是？","o":["资产减少、负债减少","只增加利润","资产增加、负债增加","只减少权益"],"a":2,"why":"收到借款，现金资产与借款负债同时增加。"}],"keywords":["资产=负债+权益","应收vs应付","权责发生制","时点vs期间","现金流三类","借贷方向"],"source":[],"priority":"核心"},{"id":"f5","track":"finance","day":5,"title":"财务管理与常考计算","sub":"只学笔试最常用的公式，不做复杂推导","duration":65,"sections":[{"title":"① 资金时间价值与折现","lead":"今天的100元与一年后的100元价值不同，未来现金流需按折现率折回今天。","points":["现值PV＝终值FV ÷ (1+r)^n。","例如一年后收到110元，年利率10%，现值=100元。","折现率提高时，给定未来现金流的现值下降。"],"example":"FV=121元、r=10%、两年，PV=121÷1.1²=100。","trap":"","formula":""},{"title":"② NPV与IRR","lead":"NPV衡量未来现金流折现后的净价值，IRR是令项目NPV等于0的折现率。","points":["NPV＝Σ各期现金流/(1+r)^t−期初投资（简化式）。","NPV＞0的独立项目在适当假设下通常可接受。","互斥项目比较时，优先考虑NPV和约束，不能只看IRR大小。"],"example":"投资100万元，一年后回收121万元，折现率10%，NPV=121÷1.1−100=10万元。","trap":"","formula":""},{"title":"③ ROE、ROA与偿债比率","lead":"财务比率是最常见的快速计算题。","points":["ROE＝净利润÷平均所有者权益。","ROA＝净利润÷平均总资产（常见口径）。","资产负债率＝总负债÷总资产；流动比率＝流动资产÷流动负债。"],"example":"净利润20万、平均权益100万，ROE=20%；流动资产200万、流动负债100万，流动比率=2。","trap":"具体分母口径以题目要求或财务分析教材定义为准。","formula":""},{"title":"④ 杜邦分析、杠杆与WACC","lead":"财务管理不只考计算，还会问提升ROE和资本成本的原因。","points":["杜邦常用：ROE＝净利率×总资产周转率×权益乘数（匹配平均数口径）。","WACC是股权、债权等融资成本按资本结构加权后的资本成本。","债务融资增加可能放大股东回报波动及偿债压力。"],"example":"企业权益乘数提高，可能拉高ROE，但也通常伴随财务杠杆风险增加。","trap":"","formula":""}],"questions":[{"q":"一年后收到110元，年折现率10%，现值是？","o":["110元","100元","99元","121元"],"a":1,"why":"110÷1.1=100元。"},{"q":"两年后收到121元，折现率10%，现值是？","o":["121元","110元","100元","90元"],"a":2,"why":"121÷1.1²=100元。"},{"q":"投资100万，一年后回收121万，折现率10%，NPV为？","o":["−10万","0万","21万","10万"],"a":3,"why":"121÷1.1−100=10。"},{"q":"IRR是使哪个指标为零的折现率？","o":["NPV","ROE","ROA","GDP"],"a":0,"why":"内部收益率是净现值等于零的折现率。"},{"q":"净利润20万元、平均权益100万元，ROE为？","o":["10%","20%","5%","50%"],"a":1,"why":"20÷100=20%。"},{"q":"净利润15万元、平均资产300万元，ROA为？","o":["20%","10%","5%","15%"],"a":2,"why":"15÷300=5%。"},{"q":"资产500万、负债300万，资产负债率？","o":["40%","30%","50%","60%"],"a":3,"why":"300÷500=60%。"},{"q":"流动资产200万、流动负债100万，流动比率？","o":["2","0.5","100","200"],"a":0,"why":"200÷100=2。"},{"q":"WACC最接近什么？","o":["资产负债比","加权平均资本成本","利润增长率","通胀率"],"a":1,"why":"Weighted Average Cost of Capital。"},{"q":"同等现金流下，折现率上升，现值一般？","o":["上升","不变","下降","必然为零"],"a":2,"why":"折现率越高，未来现金流现值越低。"},{"q":"企业财务杠杆较高时，股东回报可能？","o":["风险必定归零","必然保证收益","只与原材料有关","波动性更高"],"a":3,"why":"杠杆放大权益回报与风险。"},{"q":"杜邦分析中的三个基础因素通常包括？","o":["净利率、资产周转率、权益乘数","GDP、CPI、PPI","期权、期货、互换","负债率、汇率、基差"],"a":0,"why":"杜邦分析可将ROE分解为这三项。"}],"keywords":["PV=FV/(1+r)^n","NPV\u003e0","ROE/ROA","负债率/流动比率","WACC/杜邦"],"source":[],"priority":"核心"},{"id":"f6","track":"finance","day":6,"title":"信托租赁、合规与信息系统","sub":"压缩记忆：专业笔试中的常识补充","duration":60,"sections":[{"title":"① 信托、租赁与金融牌照","lead":"按五矿资本年报理解金融机构，比背抽象定义更快。","points":["信托三分类：资产服务信托、资产管理信托、公益慈善信托。","金融租赁：直租（出租人购买设备并出租）与售后回租（原所有人售出设备再租回）。","证券业务常考经纪、投行承销、资管；期货常考经纪、套保和风险管理。"],"example":"生产企业需要设备资金，可考虑金融租赁模式；企业需应对铜价波动，可考虑期货套保。","trap":"","formula":""},{"title":"② 合规、内部控制与治理","lead":"职能岗位也可能考合规常识和企业内部控制。","points":["不相容职务分离：付款审批、支付执行、财务复核不宜由同一人包揽。","资产管理产品不能任意宣称“无风险保本”。","识别关联交易、利益冲突、信息隔离和客户适当性等基本原则。"],"example":"同一员工既批款又出款又对账，内部控制存在明显缺陷。","trap":"","formula":""},{"title":"③ 管理信息系统高频缩写","lead":"本节按识别题要求学习，复杂数据库技术不是本轮主攻。","points":["ERP：企业资源计划，整合采购、库存、财务、生产等信息。","CRM：客户关系管理；DSS：决策支持系统；MIS：管理信息系统。","DBMS：数据库管理系统；OLTP偏日常事务处理，OLAP偏分析。"],"example":"财务、库存、采购数据打通：优先想到ERP。","trap":"","formula":""},{"title":"④ 信息安全与管理学","lead":"与管理系统一道高频出现的基础词汇。","points":["信息安全CIA：机密性、完整性、可用性。","最小权限原则：只授予履职必要的系统权限。","PDCA：Plan计划→Do执行→Check检查→Act处理。","金融风险分类：信用、市场、流动性、操作风险。"],"example":"数据库主键用于唯一标识记录；系统故障造成交易损失常归操作风险。","trap":"","formula":""}],"questions":[{"q":"信托业务三分类包括哪项？","o":["存款信托、贷款信托、股票信托","资产服务、资产管理、公益慈善信托","零售信托、批发信托、国际信托","商业、企业、政府存款信托"],"a":1,"why":"监管口径为资产服务、资产管理、公益慈善信托。"},{"q":"融资租赁“售后回租”通常指？","o":["先发行股票后回购","租金永远不变","原资产所有人出售资产后租回使用","完全无设备交易"],"a":2,"why":"售后回租体现设备出售与租回使用。"},{"q":"下列哪个通常属于五矿证券开展的业务类型？","o":["中央银行货币发行","法定税收征管","商业银行存款创造","证券经纪与承销保荐"],"a":3,"why":"证券公司可以依法开展证券经纪、承销保荐等获准业务。"},{"q":"内部控制中的不相容职务分离是指？","o":["付款审批与执行尽可能分离","同一人负责所有审批","取消复核","员工共享管理员密码"],"a":0,"why":"职责分离降低错误与舞弊风险。"},{"q":"ERP全称最接近？","o":["企业风险溢价","企业资源计划","外汇储备政策","金融交易报价"],"a":1,"why":"ERP = Enterprise Resource Planning。"},{"q":"CRM主要用于？","o":["中央银行决策","数据库备份","客户关系管理","收益率计算"],"a":2,"why":"CRM=Customer Relationship Management。"},{"q":"DSS属于？","o":["证券经纪服务","矿山安全专用设备","贷款合同","决策支持系统"],"a":3,"why":"DSS=Decision Support System。"},{"q":"DBMS是？","o":["数据库管理系统","数据通胀指数","数字信托基金","债券价格模型"],"a":0,"why":"DBMS=Database Management System。"},{"q":"CIA信息安全三要素是？","o":["资本、投资、资产","机密性、完整性、可用性","成本、利率、收益","交易、清算、交割"],"a":1,"why":"Confidentiality、Integrity、Availability。"},{"q":"数据库主键的重要要求是？","o":["必填手机号","允许所有记录重复","唯一且非空","只能是中文字符"],"a":2,"why":"主键用于唯一标识表中记录。"},{"q":"PDCA循环正确顺序是？","o":["执行、计划、处理、检查","检查、计划、执行、处理","处理、计划、检查、执行","计划、执行、检查、处理"],"a":3,"why":"Plan-Do-Check-Act。"},{"q":"系统故障导致订单错误，更接近？","o":["操作风险","信用风险","汇率风险","财政政策"],"a":0,"why":"信息系统故障是操作风险典型来源。"}],"keywords":["信托三分类","直租/售后回租","ERP/CRM/DSS","CIA","PDCA","内部控制"],"source":["https://paper.cnstock.com/html/2026-04/18/content_2201598.htm"],"priority":"核心"}],"cards":[{"front":"中国五矿的初心使命是什么？","back":"矿业报国、矿业强国"},{"front":"中国五矿战略愿景的完整表述？","back":"成为具有全球竞争力的世界一流金属矿产企业集团"},{"front":"中国五矿品牌定位是什么？","back":"资源保障国家队、两新服务主力军"},{"front":"央企发挥哪三个作用？","back":"科技创新、产业控制、安全支撑"},{"front":"中国五矿的五个文化关键词？","back":"世界一流、自主创新、问题导向、精益求精、敢于胜利"},{"front":"“问题导向”对应什么？","back":"工作思维"},{"front":"“精益求精”对应什么？","back":"品质坚守"},{"front":"“敢于胜利”对应什么？","back":"奋斗精神"},{"front":"“依法治企，合规经营”属于什么文化？","back":"法治文化"},{"front":"“居安思危，未雨绸缪”属于什么文化？","back":"风控文化"},{"front":"“崇廉尚洁，恪守底线”属于什么文化？","back":"廉洁文化"},{"front":"“德才兼备，人尽其才”属于什么文化？","back":"人才文化"},{"front":"“生命至上，安全第一”属于什么文化？","back":"安全文化"},{"front":"“绿色发展，和谐共生”属于什么文化？","back":"绿色文化"},{"front":"五矿资本主要四家牌照公司与业务？","back":"五矿信托—信托；外贸金租—金融租赁；五矿证券—证券；五矿期货—期货"},{"front":"五矿资本A股股票代码？","back":"600390"},{"front":"金融五篇大文章？","back":"科技金融、绿色金融、普惠金融、养老金融、数字金融"},{"front":"金属矿山未来卖矿怕跌价，期货套保方向？","back":"卖出期货（空头套保）"},{"front":"金属加工企业未来采购怕涨价，期货套保方向？","back":"买入期货（多头套保）"},{"front":"信托业务三分类？","back":"资产服务信托、资产管理信托、公益慈善信托"}],"sources":[{"name":"中国五矿｜企业文化","url":"https://www.minmetals.com.cn/gywk_7233/qywh/"},{"name":"中国五矿｜品牌理念","url":"https://www.minmetals.com.cn/gywk_7233/ppln/"},{"name":"五矿资本2025年年度报告摘要","url":"https://paper.cnstock.com/html/2026-04/18/content_2201598.htm"},{"name":"国务院金融五篇大文章指导意见","url":"https://app.www.gov.cn/govdata/gov/202503/05/525163/article.html"}]};
const KEY='minmetals-study-2026-v1';
const emptyState=()=>({read:{},best:{},attempts:{},wrongs:{},cards:{},reviewCount:0,history:[],draft:null});
let state=load();
let view='home',activeLesson=null, quiz=null, reviewSession=null, showAnswer=false, summary=null;
const DAYS=['','第1讲','第2讲','第3讲','第4讲','第5讲','第6讲'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function futureDate(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY));return {...emptyState(),...(saved&&typeof saved==='object'?saved:{})}}catch{return emptyState()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Storage unavailable:',e)}}
function lesson(id){return DATA.lessons.find(x=>x.id===id)}
function completed(l){return (state.best[l.id]??0)>=9}
function trackList(t){return DATA.lessons.filter(l=>l.track===t)}
function doneCount(t){return trackList(t).filter(completed).length}
function totalDone(){return DATA.lessons.filter(completed).length}
function dueCount(){return DATA.cards.filter((_,i)=>!state.cards[i]||state.cards[i].due<=cDate()).length}
function wrongCount(){return Object.keys(state.wrongs).length}
function icon(id){return ({home:'⌂',culture:'◇',finance:'▤',review:'▣',wrongs:'↺'})[id]}
function navHtml(id,label,count){return `<button class="nav-btn ${isActiveNav(id)?'active':''}" data-nav="${id}"><span class="nav-glyph">${icon(id)}</span><span>${label}</span>${count!==undefined?`<span class="small-count">${count}</span>`:''}</button>`}
function isActiveNav(id){if(['lesson','quiz','summary'].includes(view)){const l=lesson(activeLesson);return id===(l?.track??'home')}return view===id}
function renderNav(){const items=[['home','总览',''],['culture','企业文化',`${doneCount('culture')}/3`],['finance','金融专业课',`${doneCount('finance')}/6`]];const extra=[['review','每日巩固',dueCount()],['wrongs','错题本',wrongCount()]];$('sideNav').innerHTML=items.map(a=>navHtml(...a)).join('');$('sideExtra').innerHTML=extra.map(a=>navHtml(...a)).join('');$('mobileNav').innerHTML=[...items,...extra].map(([id,label])=>`<button data-nav="${id}" class="${isActiveNav(id)?'active':''}"><b>${icon(id)}</b><span>${label}</span></button>`).join('');$('sideLabel').textContent=`完成 ${totalDone()} / 9 个模块`;$('sideDetail').textContent=`企业文化 ${doneCount('culture')}/3 · 金融 ${doneCount('finance')}/6`;$('sideBar').style.width=`${Math.round(totalDone()/9*100)}%`}
function progress(i,total){return `<div class="meter"><i style="width:${(i/total)*100}%"></i></div>`}
function lessonTile(l){const st=completed(l)?'<span class="badge done">已掌握</span>':state.read[l.id]?'<span class="badge started">已读讲义</span>':'<span class="badge">待学习</span>';const best=state.best[l.id]!=null?` · 历史最高 ${state.best[l.id]}/12`:'';return `<div class="lesson-tile"><div class="tile-index ${l.track==='culture'?'culture':''}">${String(l.day).padStart(2,'0')}</div><div><h3>${esc(l.title)}</h3><p class="desc">${esc(l.sub)}</p><div class="micro">约 ${l.duration} 分钟 · 4 节讲义 · 12 题${best}</div></div><div class="tile-actions">${st}<button class="primary" data-open="${l.id}">${completed(l)?'复习本讲 →':state.read[l.id]?'继续学习 →':'开始学习 →'}</button></div></div>`}
function home(){const cultures=trackList('culture'), finance=trackList('finance');const draft=state.draft?`<div class="note-box">你有一套尚未交卷的题目：<b>${esc(state.draft.mode==='lesson'?lesson(state.draft.lessonId)?.title:'错题复习')}</b>。<button class="linkbtn" data-resume>继续上次答题 →</button></div>`:'';return `<section class="hero"><span class="eyebrow">9 讲完成第一轮 · 先学后测</span><h1>五矿笔试，<br>从企业文化学起。</h1><p>企业文化 3 讲速通，随后每天用 5 分钟抽查；金融课压缩为 6 讲，只保留从零基础能快速建立的高价值考点。每节讲义结束后再做 12 道题。</p><div class="buttons"><button class="primary" data-open="${cultures.find(l=>!completed(l))?.id??'c1'}">继续企业文化 →</button><button class="secondary" data-nav="finance">看看金融计划</button></div></section>${draft}<div class="stats"><div class="stat"><strong>${totalDone()}<span style="font-size:17px;color:#94a699"> / 9</span></strong><span>已掌握课程</span></div><div class="stat"><strong>${Object.values(state.attempts).reduce((a,b)=>a+(b.length||0)*12,0)}</strong><span>已做模块题次（包含重做）</span></div><div class="stat"><strong>${wrongCount()}</strong><span>当前待巩固错题</span></div></div><div class="section-heading"><div><h2>两条学习路线</h2><p>先企业文化，金融接续；完成日期由你决定。</p></div></div><div class="track-grid"><div class="track-card culture"><span class="tag">PART 01 · 3天速通</span><h3>企业文化</h3><p>使命、愿景、战略定位、品牌准则、五矿资本、产业金融与政策。第一轮结束后每天5分钟巩固。</p><div class="track-foot">${progress(doneCount('culture'),3)}<button class="linkbtn" data-nav="culture">进入课程 →</button></div></div><div class="track-card"><span class="tag">PART 02 · 6天速通</span><h3>金融专业课</h3><p>经济、货币银行、证券衍生品、会计、财务管理、信托合规与管理系统，先学最重要的题型。</p><div class="track-foot">${progress(doneCount('finance'),6)}<button class="linkbtn" data-nav="finance">进入课程 →</button></div></div></div><div class="section-heading"><div><h2>今天可以做什么</h2><p>完成一节后再推进下一节，复习中心每天都可以打开。</p></div></div><div class="learning-grid">${lessonTile(cultures.find(l=>!completed(l))??cultures[2])}${lessonTile(finance.find(l=>!completed(l))??finance[5])}</div><div class="note-box"><b>节奏建议：</b>企业文化第1—3次学习完成三讲；金融第1—6次学习完成六讲。企业文化第三讲后，每次学习前先进行5分钟文化抽查。未学完不用因为跨天而重排。</div>`}
function trackPage(t){let isC=t==='culture',ls=trackList(t),done=doneCount(t),n=ls.length;return `<div class="crumb"><button data-nav="home">首页</button> / ${isC?'企业文化':'金融专业课'}</div><section class="hero" style="background:${isC?'#514934':'#294b49'}"><span class="eyebrow">${isC?'PART 01 · 3 LECTURES':'PART 02 · 6 LECTURES'}</span><h1>${isC?'企业文化 · 3讲速通':'金融专业课 · 6讲速通'}</h1><p>${isC?'先背集团官方文化，再理解五矿资本，最后通过情境题连接业务。三讲之后，利用复习中心每天做5分钟抽查。':'从零基础出发，优先高频概念、基础公式和真实业务场景。考虑到专业题是否出现尚不确定，本轮刻意减少深奥推导。'}</p><div style="max-width:380px;margin-top:20px">${progress(done,n)}</div><small style="display:block;color:#dce8de;margin-top:8px">已掌握 ${done} / ${n} 讲</small></section><div class="section-heading"><div><h2>讲义与测验</h2><p>讲义 4 节 / 测验 12 题 / 达到 9 题正确视为首轮掌握</p></div></div><div class="learning-grid">${ls.map(lessonTile).join('')}</div>${isC?`<div class="review-hero" style="margin-top:20px"><div><span class="eyebrow">复习中心</span><h2>每天 5 分钟，防止遗忘</h2><p>20张文化闪卡，先回忆再翻答案；系统安排隔天、3天、7天等复习。</p></div><button class="primary" data-nav="review">进入文化抽查 →</button></div>`:''}`}
function chapterHtml(c,i){return `<article class="chapter"><div class="eyebrow">KNOWLEDGE ${String(i+1).padStart(2,'0')}</div><h3>${esc(c.title)}</h3><p>${esc(c.lead)}</p><ul>${c.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${c.formula?`<div class="formula"><strong>必会公式</strong>${esc(c.formula)}</div>`:''}${c.example?`<div class="example"><strong>举个例子</strong>${esc(c.example)}</div>`:''}${c.trap?`<div class="trap"><strong>考试陷阱</strong>${esc(c.trap)}</div>`:''}</article>`}
function lessonPage(id){const l=lesson(id);if(!l)return home();return `<div class="crumb"><button data-nav="home">首页</button> / <button data-nav="${l.track}">${l.track==='culture'?'企业文化':'金融专业课'}</button> / 第${l.day}讲</div><header class="lesson-header"><span class="eyebrow">${l.track==='culture'?'ENTERPRISE CULTURE':'FINANCE ESSENTIALS'} · LESSON ${l.day}</span><h1>${esc(l.title)}</h1><p>${esc(l.sub)}</p><div class="chipline"><span class="chip">约${l.duration}分钟</span><span class="chip">先讲再考</span><span class="chip">12道单选</span><span class="chip">通过：9 / 12</span></div></header><div class="note-box"><b>学习方式：</b>先读完下面4组知识卡及例题，再按页面底部“开始测验”。遇到不熟悉的缩写可以反复查看讲义，首轮不要求死记复杂推导。</div>${l.sections.map(chapterHtml).join('')}<div class="chapter"><h3>本讲记忆清单</h3><div class="chipline">${l.keywords.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div>${l.source.length?`<p class="tiny-note" style="margin-top:18px">相关公开资料：${l.source.map((s,i)=>`<a target="_blank" rel="noopener noreferrer" href="${esc(s)}">来源 ${i+1} ↗</a>`).join('　')}</p>`:''}</div><div class="study-final"><div><h3>讲义结束 · 现在进行测验</h3><p>12道原创模拟题，逐题选择后显示解析，完成后自动保存成绩和错题。</p></div><button class="primary" data-start="${l.id}">开始本讲测验 →</button></div>`}
function getQ(entry){return lesson(entry.id).questions[entry.i]}
function startQuiz(id,mode='lesson'){let entries=mode==='wrong'?Object.keys(state.wrongs).map(k=>{let [a,b]=k.split(':');return {id:a,i:Number(b)}}).filter(e=>lesson(e.id)?.questions[e.i]):lesson(id).questions.map((_,i)=>({id,i}));if(!entries.length){view='wrongs';render();return}quiz={mode,lessonId:id,index:0,entries,answers:{}};state.read[id]=Date.now();state.draft=quiz;save();activeLesson=id;view='quiz';render();}
function restoreDraft(){if(!state.draft)return;quiz=state.draft;activeLesson=quiz.lessonId||quiz.entries[0]?.id;view='quiz';render()}
function answerQuestion(i){if(!quiz)return;const ix=quiz.index;if(quiz.answers[ix]!==undefined)return;quiz.answers[ix]=i;state.draft=quiz;save();render()}
function nextQuiz(){if(!quiz)return;if(quiz.index<quiz.entries.length-1){quiz.index++;state.draft=quiz;save();render()}else finishQuiz()}
function previousQuiz(){if(quiz&&quiz.index>0){quiz.index--;state.draft=quiz;save();render()}}
function quizPage(){if(!quiz)return home();const n=quiz.entries.length,ix=quiz.index,entry=quiz.entries[ix],x=getQ(entry),selected=quiz.answers[ix],answered=selected!==undefined,good=answered&&selected===x.a;return `<div class="crumb"><button data-back-quiz>退出测验</button> / ${quiz.mode==='lesson'?esc(lesson(quiz.lessonId).title):'错题重做'}</div><div class="quiz-box"><div class="quiz-track"><span>${quiz.mode==='lesson'?'本讲测验 · 讲后练':'错题强化 · 讲后练'}</span><strong>第 ${ix+1} / ${n} 题</strong></div><div class="quiz-meter"><i style="width:${((ix+1)/n)*100}%"></i></div><span class="eyebrow">SINGLE CHOICE</span><div class="question">${esc(x.q)}</div><div class="options">${x.o.map((op,j)=>`<button class="option ${answered?(j===x.a?'correct':j===selected?'wrong':''):''}" data-answer="${j}" ${answered?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${esc(op)}</span></button>`).join('')}</div>${answered?`<div class="feedback ${good?'':'wrong'}"><strong>${good?'✓ 回答正确':`✕ 正确答案：${'ABCD'[x.a]}`}</strong>${esc(x.why)}</div>`:`<div class="tiny-note" style="margin-top:17px">先选一个答案，系统才会显示解析。</div>`}<div class="quiz-nav"><button class="tertiary" data-prev ${ix===0?'disabled':''}>← 上一题</button><button class="primary" data-next ${!answered?'disabled':''}>${ix===n-1?'交卷并查看结果':'下一题 →'}</button></div><div class="answer-dots">${quiz.entries.map((e,i)=>{const a=quiz.answers[i];return `<button data-jump="${i}" class="${i===ix?'active':a===undefined?'':a===getQ(e).a?'correct':'wrong'}" title="第${i+1}题">${i+1}</button>`}).join('')}</div></div>`}
function finishQuiz(){if(!quiz)return;const ans=quiz.entries.map((e,i)=>({entry:e,selected:quiz.answers[i],question:getQ(e)}));const score=ans.filter(x=>x.selected===x.question.a).length;for(const x of ans){const k=`${x.entry.id}:${x.entry.i}`;if(x.selected===x.question.a)delete state.wrongs[k];else state.wrongs[k]=(state.wrongs[k]||0)+1;}if(quiz.mode==='lesson'){const id=quiz.lessonId;state.best[id]=Math.max(score,state.best[id]??0);(state.attempts[id]??=[]).push({date:new Date().toISOString(),score,total:ans.length})}summary={mode:quiz.mode,lessonId:quiz.lessonId,score,total:ans.length,items:ans};quiz=null;state.draft=null;state.history.unshift({date:new Date().toISOString(),mode:summary.mode,lesson:summary.lessonId,score,total:summary.total});if(state.history.length>120)state.history.length=120;save();view='summary';render()}
function summaryPage(){if(!summary){view='home';return home()}const s=summary,pass=s.mode==='lesson'&&s.score>=9;const l=lesson(s.lessonId);return `<div class="score-shell"><span class="eyebrow">SESSION COMPLETED</span><h1 style="margin:13px 0 2px">${pass?'本讲已掌握':s.mode==='wrong'?'错题强化完成':'完成本讲测验'}</h1><div class="score-big">${s.score}<small> / ${s.total}</small></div><div class="meter" style="margin:11px 0 15px"><i style="width:${s.score/s.total*100}%"></i></div><p class="quiet">正确率 ${Math.round(s.score/s.total*100)}%。${s.mode==='lesson'?`本讲通过线为9/12；${pass?'已经记录为完成。':'建议先回顾知识卡，再重做。'}`:'做对的题已从待巩固错题本移除。'}</p><div class="tools"><button class="primary" data-open="${s.lessonId}">回顾讲义</button><button class="secondary" data-start="${s.lessonId}">重做本讲</button><button class="tertiary" data-nav="${l?.track||'wrongs'}">返回课程</button></div><div class="section-heading"><div><h2>逐题核对</h2><p>错误题目保留至错题本，后续做对后移除</p></div></div><div class="score-list">${s.items.map((x,i)=>`<div class="result-row"><strong style="color:${x.selected===x.question.a?'var(--green)':'var(--red)'}">${x.selected===x.question.a?'✓':'✕'} 第${i+1}题 · ${esc(x.question.q)}</strong><p>你的答案：${x.selected===undefined?'未答':'ABCD'[x.selected]} / 正确答案：${'ABCD'[x.question.a]} · ${esc(x.question.why)}</p></div>`).join('')}</div></div>`}
function reviewStart(force=false){const due=DATA.cards.map((_,i)=>i).filter(i=>!state.cards[i]||state.cards[i].due<=cDate());const ids=(force||!due.length?DATA.cards.map((_,i)=>i):due).sort(()=>Math.random()-.5).slice(0,8);reviewSession={ids,index:0,remembered:0,again:0};showAnswer=false;view='review';render()}
function reviewStep(remember){if(!reviewSession)return;const id=reviewSession.ids[reviewSession.index];let record=state.cards[id]||{stage:0};const stage=remember?(record.last?Math.min(4,(record.stage||0)+1):0):0;const gaps=[1,3,7,14,30];state.cards[id]={stage,due:futureDate(gaps[stage]),last:cDate()};state.reviewCount++;reviewSession[remember?'remembered':'again']++;reviewSession.index++;showAnswer=false;save();render()}
function reviewPage(){const r=reviewSession;if(!r)return `<div class="crumb"><button data-nav="home">首页</button> / 每日复习</div><div class="review-hero"><div><span class="eyebrow">SPACED REPETITION</span><h2>文化闪卡 · 每天5分钟</h2><p>系统会优先抽查到期知识点，并按1、3、7、14、30天安排后续复习；也支持随时自由抽查。</p></div><div style="text-align:center"><div style="font-size:36px;font-weight:800;color:#756344">${dueCount()}</div><small>待复习卡片</small></div></div><div class="stats"><div class="stat"><strong>${DATA.cards.length}</strong><span>文化记忆卡</span></div><div class="stat"><strong>${Object.values(state.cards).filter(x=>x.stage>=2).length}</strong><span>进入巩固阶段</span></div><div class="stat"><strong>${state.reviewCount}</strong><span>累计复习次数</span></div></div><div class="tools"><button class="primary" data-reviewstart="due">开始今天的8张卡 →</button><button class="secondary" data-reviewstart="all">随机抽查8张</button><button class="tertiary" data-nav="culture">回到企业文化课程</button></div><div class="note-box">每张卡先在心里回答，再点击“翻开答案”。觉得还没记牢选“再记一次”；觉得能独立回忆选“记住了”。</div>`;if(r.index>=r.ids.length){const total=r.ids.length;reviewSession=null;return `<div class="score-shell"><span class="eyebrow">DAILY REVIEW</span><h1>今天的复习完成</h1><p>共复习 ${total} 张卡，其中记住 ${r.remembered} 张，需要加强 ${r.again} 张。</p><div class="tools"><button class="primary" data-reviewstart="all">再随机复习8张 →</button><button class="secondary" data-nav="culture">返回企业文化</button></div></div>`;}const i=r.ids[r.index],card=DATA.cards[i];return `<div class="crumb"><button data-reviewend>退出复习</button> / 今日抽查</div><div class="quiz-track"><span>文化记忆卡</span><strong>${r.index+1} / ${r.ids.length}</strong></div><div class="quiz-meter"><i style="width:${(r.index+1)/r.ids.length*100}%"></i></div><div class="flash-shell"><div class="flash-card"><span class="eyebrow">${showAnswer?'ANSWER':'RECALL FIRST'}</span><div class="front">${esc(card.front)}</div>${showAnswer?`<div class="back">${esc(card.back)}</div>`:''}</div><div class="flash-actions">${showAnswer?`<button class="secondary" data-cardresult="0">需要加强</button><button class="primary" data-cardresult="1">记住了 ✓</button>`:`<button class="primary" data-flip>翻开答案 →</button>`}</div></div>`}
function wrongPage(){const keys=Object.keys(state.wrongs);return `<div class="crumb"><button data-nav="home">首页</button> / 错题本</div><div class="lesson-header"><span class="eyebrow">ERROR REVIEW</span><h1>错题本</h1><p>每次完成测验后自动收录错题；在错题强化中答对后自动移除。</p><div class="chipline"><span class="chip">待巩固 ${keys.length} 道</span><span class="chip">题目来自已学课程</span></div></div>${keys.length?`<div class="tools"><button class="primary" data-wrongstart>开始全部错题重做 →</button><button class="secondary" data-nav="home">回课程总览</button></div><div class="score-list">${keys.map(k=>{let [id,i]=k.split(':'),l=lesson(id),q=l?.questions[Number(i)];return q?`<div class="result-row"><strong>${esc(l.title)} · ${esc(q.q)}</strong><p>知识提示：${esc(q.why)}</p></div>`:''}).join('')}</div>`:`<div class="empty"><strong>目前没有待巩固错题</strong>完成各模块测验后，错误题目会自动出现在这里。<div style="margin-top:15px"><button class="primary" data-nav="culture">开始企业文化 →</button></div></div>`}`}
function bind(){document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>{const v=e.dataset.nav;if(view==='quiz'&&quiz){state.draft=quiz;save()}view=v;reviewSession=null;render()});document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{activeLesson=e.dataset.open;view='lesson';render()});document.querySelectorAll('[data-start]').forEach(e=>e.onclick=()=>startQuiz(e.dataset.start));document.querySelectorAll('[data-answer]').forEach(e=>e.onclick=()=>answerQuestion(Number(e.dataset.answer)));document.querySelectorAll('[data-next]').forEach(e=>e.onclick=nextQuiz);document.querySelectorAll('[data-prev]').forEach(e=>e.onclick=previousQuiz);document.querySelectorAll('[data-jump]').forEach(e=>e.onclick=()=>{const ix=Number(e.dataset.jump);if(quiz&&quiz.answers[ix]!==undefined){quiz.index=ix;state.draft=quiz;save();render()}});document.querySelectorAll('[data-back-quiz]').forEach(e=>e.onclick=()=>{if(quiz){state.draft=quiz;save();view=quiz.mode==='lesson'?'lesson':'wrongs';render()}});document.querySelectorAll('[data-resume]').forEach(e=>e.onclick=restoreDraft);document.querySelectorAll('[data-reviewstart]').forEach(e=>e.onclick=()=>reviewStart(e.dataset.reviewstart==='all'));document.querySelectorAll('[data-flip]').forEach(e=>e.onclick=()=>{showAnswer=true;render()});document.querySelectorAll('[data-cardresult]').forEach(e=>e.onclick=()=>reviewStep(e.dataset.cardresult==='1'));document.querySelectorAll('[data-reviewend]').forEach(e=>e.onclick=()=>{reviewSession=null;view='review';render()});document.querySelectorAll('[data-wrongstart]').forEach(e=>e.onclick=()=>startQuiz(Object.keys(state.wrongs)[0].split(':')[0],'wrong'))}
function render(){renderNav();if(view==='quiz'&&!quiz&&state.draft)quiz=state.draft;const pages={home,culture:()=>trackPage('culture'),finance:()=>trackPage('finance'),lesson:()=>lessonPage(activeLesson),quiz:quizPage,review:reviewPage,wrongs:wrongPage,summary:summaryPage};$('screen').innerHTML=(pages[view]||home)();bind();window.scrollTo({top:0,behavior:'instant'})}
function backup(){const payload={app:'minmetals-study-site',version:1,exported:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`五矿笔试_学习进度_${cDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('backupBtn').onclick=backup;$('restoreBtn').onclick=()=>$('restoreInput').click();$('restoreInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const json=JSON.parse(await f.text());if(json.app!=='minmetals-study-site'||!json.state||typeof json.state!=='object')throw Error('不是本学习站导出的进度文件');if(!confirm('恢复进度将覆盖本设备现有答题记录，确定继续吗？'))return;state={...emptyState(),...json.state};save();quiz=null;view='home';render();alert('已恢复进度')}catch(err){alert(`导入失败：${err.message}`)}e.target.value=''};
render();
</script>
</body>
</html>
